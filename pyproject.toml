[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-lora"
version = "0.1.0"
description = "Reproducible LoRA adaptation and evaluation of brain MRI vision encoders"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "nibabel>=5.2,<6",
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
  "safetensors>=0.4,<1",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "timm>=1.0.7,<2",
  "torch>=2.3,<3",
]

[project.scripts]
brain-lora = "brain_lora.cli:main"

[tool.setuptools.packages.find]
include = ["brain_lora*"]
